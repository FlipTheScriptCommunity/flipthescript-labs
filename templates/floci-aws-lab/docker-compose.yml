services:
  floci:
    image: floci/floci:latest
    container_name: floci
    ports:
      - '127.0.0.1:4566:4566'
    # Lambda functions run as real containers (public.ecr.aws/lambda/<runtime>),
    # which Floci starts through the Docker socket.
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
